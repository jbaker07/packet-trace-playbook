name: tests

on:
  push:
  pull_request:

jobs:
  timeline:
    #pinned to 24.04 because the expected timeline was made with its tshark 4.2.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
      - name: Run tests
        run: ./tests/run_tests.sh
